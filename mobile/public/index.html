<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030611" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="DriveNearby AI - Next-generation mobility platform with AI match, satellite map, and trust scoring." />
    <title>DriveNearby AI • Autonomous & Chauffeur Mobility Platform</title>

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        margin: 0;
        padding: 0;
        background-color: #030611;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #root {
        display: flex;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        width: 100%;
        flex: 1;
        background-color: #030611;
      }

      /* Sleek futuristic scrollbar for web */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(3, 6, 17, 0.8);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 242, 254, 0.25);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 242, 254, 0.5);
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run DriveNearby AI.
    </noscript>
    <div id="root"></div>
  </body>
</html>
